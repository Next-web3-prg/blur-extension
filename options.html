<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Blur Toggle — Exceptions</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #fff;
      --ink: #1a2332;
      --muted: #6b7789;
      --line: #e5e9f0;
      --accent: #3b82f6;
      --accent-soft: #ebf3ff;
      --accent-deep: #2563eb;
      --danger: #e11d48;
      --danger-soft: #fff1f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", ui-sans-serif, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 0% 0%, #dbeafe 0%, transparent 50%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #0b1220;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-mark img {
      width: 28px;
      height: 28px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(26, 35, 50, 0.04), 0 8px 24px rgba(26, 35, 50, 0.05);
    }

    .card + .card { margin-top: 14px; }

    .card-title {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .card-desc {
      margin: 0 0 14px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .toolbar input[type="search"],
    .toolbar input[type="text"] {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      font: inherit;
      font-size: 13px;
      background: #fafbfd;
      color: var(--ink);
    }

    .toolbar input:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--accent);
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent-deep); }

    .btn-ghost {
      background: #fafbfd;
      color: var(--accent-deep);
      border: 1px solid var(--line);
    }

    .btn-ghost:hover { background: var(--accent-soft); }

    .list {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fafbfd;
      max-height: 420px;
      overflow: auto;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .item:last-child { border-bottom: none; }

    .item-host {
      flex: 1;
      min-width: 0;
      font-family: ui-monospace, "Cascadia Mono", monospace;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-remove {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }

    .item-remove:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 28px 12px;
    }

    .meta {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .error {
      display: none;
      margin-top: 8px;
      font-size: 12px;
      color: var(--danger);
    }

    .error.is-visible { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand-mark" aria-hidden="true">
        <img src="icons/enabled-32.png" alt="" />
      </div>
      <div>
        <h1>Site exceptions</h1>
        <p class="sub">Sites listed here are never blurred, even when blur is enabled.</p>
      </div>
    </header>

    <section class="card">
      <h2 class="card-title">Add a site</h2>
      <p class="card-desc">Enter a hostname such as <code>example.com</code> or <code>mail.google.com</code>.</p>
      <div class="toolbar">
        <input type="text" id="addInput" placeholder="example.com" autocomplete="off" spellcheck="false" />
        <button type="button" class="btn btn-primary" id="addBtn">Add</button>
      </div>
      <div class="error" id="addError" role="alert"></div>
    </section>

    <section class="card">
      <h2 class="card-title">Your exceptions</h2>
      <p class="card-desc">Search and remove sites you no longer need.</p>
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Search exceptions…" autocomplete="off" />
        <button type="button" class="btn btn-ghost" id="clearAllBtn">Clear all</button>
      </div>
      <div class="list" id="list"></div>
      <div class="meta" id="meta"></div>
    </section>
  </div>

  <script src="options.js"></script>
</body>
</html>
